<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日喝水統計與紀錄 (純原生JS版)</title>
  <!-- Tailwind CSS 用於排版樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes wave {
      0% { transform: translateX(0) translateZ(0) scaleY(1); }
      50% { transform: translateX(-25%) translateZ(0) scaleY(0.85); }
      100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
    }
    .wave-effect {
      position: absolute;
      width: 200%;
      height: 200%;
      background-color: rgba(56, 189, 248, 0.7);
      border-radius: 40%;
      animation: wave 7s linear infinite;
      transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .wave-back {
      position: absolute;
      width: 200%;
      height: 200%;
      background-color: rgba(14, 165, 233, 0.45);
      border-radius: 38%;
      animation: wave 11s linear infinite reverse;
      transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">
  <div class="max-w-4xl mx-auto px-4 py-8 pb-20">
    
    <!-- 頂部標題區 -->
    <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-200 pb-5">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-sky-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-sky-200">
          <!-- 原生 SVG 水滴圖示 -->
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-900">健康喝水日記</h1>
          <p class="text-sm text-slate-500" id="current-date-text">載入中...</p>
        </div>
      </div>

      <!-- 目標調整與提醒設定 -->
      <div class="flex items-center gap-3">
        <button id="open-settings-btn" class="flex items-center gap-2 px-3 py-2 bg-white hover:bg-slate-100 text-slate-700 text-sm font-medium rounded-xl border border-slate-200 shadow-sm transition">
          <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>目標設定</span>
        </button>
        <button id="toggle-reminder-btn" class="flex items-center gap-2 px-3 py-2 bg-white hover:bg-slate-100 text-slate-700 text-sm font-medium rounded-xl border border-slate-200 shadow-sm transition">
          <svg id="reminder-icon" class="w-4 h-4 text-slate-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="reminder-status-text">提醒: 關閉</span>
        </button>
      </div>
    </header>

    <!-- 主要內容格線 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

      <!-- 左側：今日進度與水杯卡片 -->
      <div class="md:col-span-5 flex flex-col gap-6">
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center relative overflow-hidden">
          <span class="text-xs font-semibold tracking-wider text-sky-600 bg-sky-50 px-3 py-1 rounded-full mb-3">TODAY'S GOAL</span>
          <div class="flex items-baseline gap-1">
            <span class="text-4xl font-extrabold text-slate-900" id="current-amount">0</span>
            <span class="text-slate-400 font-medium">/ <span id="target-amount">2000</span> ml</span>
          </div>

          <!-- 水量圓柱杯視覺效果 -->
          <div class="relative w-44 h-64 my-6 rounded-[2.5rem] border-4 border-sky-200 overflow-hidden bg-slate-50 shadow-inner flex items-center justify-center">
            <!-- 刻度線 -->
            <div class="absolute right-2 top-0 bottom-0 w-3 flex flex-col justify-between py-6 z-20 pointer-events-none opacity-40">
              <div class="border-b-2 border-slate-400 w-full"></div>
              <div class="border-b-2 border-slate-400 w-2/3 ml-auto"></div>
              <div class="border-b-2 border-slate-400 w-full"></div>
              <div class="border-b-2 border-slate-400 w-2/3 ml-auto"></div>
              <div class="border-b-2 border-slate-400 w-full"></div>
            </div>

            <!-- 動態水層 -->
            <div id="wave-back" class="wave-back" style="top: 100%;"></div>
            <div id="wave-front" class="wave-effect" style="top: 100%;"></div>

            <!-- 百分比文字 -->
            <div class="z-10 text-center drop-shadow-md">
              <span id="percentage-text" class="text-3xl font-black text-slate-700">0%</span>
              <p class="text-xs text-slate-500 font-medium mt-0.5" id="remaining-text">還差 2000 ml</p>
            </div>
          </div>

          <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden">
            <div id="progress-bar" class="bg-sky-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <p class="text-xs text-slate-400 text-center" id="cheer-text">早晨一杯溫開水，喚醒全新的一天！💧</p>
        </div>

        <!-- 飲水快捷記錄 -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
          <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            快速記一杯
          </h2>

          <!-- 預設按鈕 -->
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="quickAddWater(150, '溫開水')" class="p-3 bg-sky-50 hover:bg-sky-100 border border-sky-100 rounded-2xl flex items-center justify-between transition group">
              <div class="flex items-center gap-2.5">
                <span class="text-xl">🥛</span>
                <div class="text-left">
                  <div class="font-semibold text-sky-900 text-sm">小水杯</div>
                  <div class="text-xs text-sky-600">150 ml</div>
                </div>
              </div>
              <span class="text-sky-400 group-hover:text-sky-600 font-bold text-lg">+</span>
            </button>

            <button onclick="quickAddWater(250, '溫開水')" class="p-3 bg-sky-50 hover:bg-sky-100 border border-sky-100 rounded-2xl flex items-center justify-between transition group">
              <div class="flex items-center gap-2.5">
                <span class="text-xl">☕</span>
                <div class="text-left">
                  <div class="font-semibold text-sky-900 text-sm">馬克杯</div>
                  <div class="text-xs text-sky-600">250 ml</div>
                </div>
              </div>
              <span class="text-sky-400 group-hover:text-sky-600 font-bold text-lg">+</span>
            </button>

            <button onclick="quickAddWater(350, '白開水')" class="p-3 bg-sky-50 hover:bg-sky-100 border border-sky-100 rounded-2xl flex items-center justify-between transition group">
              <div class="flex items-center gap-2.5">
                <span class="text-xl">🧃</span>
                <div class="text-left">
                  <div class="font-semibold text-sky-900 text-sm">隨身杯</div>
                  <div class="text-xs text-sky-600">350 ml</div>
                </div>
              </div>
              <span class="text-sky-400 group-hover:text-sky-600 font-bold text-lg">+</span>
            </button>

            <button onclick="quickAddWater(500, '礦泉水')" class="p-3 bg-sky-50 hover:bg-sky-100 border border-sky-100 rounded-2xl flex items-center justify-between transition group">
              <div class="flex items-center gap-2.5">
                <span class="text-xl">🍶</span>
                <div class="text-left">
                  <div class="font-semibold text-sky-900 text-sm">保溫瓶</div>
                  <div class="text-xs text-sky-600">500 ml</div>
                </div>
              </div>
              <span class="text-sky-400 group-hover:text-sky-600 font-bold text-lg">+</span>
            </button>
          </div>

          <!-- 自訂輸入 -->
          <div class="pt-3 border-t border-slate-100">
            <div class="flex gap-2">
              <select id="custom-type" class="bg-slate-50 border border-slate-200 text-xs sm:text-sm rounded-xl px-3 py-2 outline-none focus:border-sky-500">
                <option value="白開水">白開水</option>
                <option value="溫開水">溫開水</option>
                <option value="無糖茶">無糖茶</option>
                <option value="黑咖啡">黑咖啡</option>
                <option value="檸檬水">檸檬水</option>
              </select>
              <input type="number" id="custom-amount-input" placeholder="容量 (ml)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-sky-500" min="10" max="2000" step="10">
              <button id="add-custom-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition shrink-0">
                添加
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側：今日紀錄與週期統計 -->
      <div class="md:col-span-7 flex flex-col gap-6">

        <!-- 7天趨勢圖 (純原生 Canvas 繪製) -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
              <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              近 7 日喝水量分析
            </h2>
            <span class="text-xs text-slate-400">單位：毫升 (ml)</span>
          </div>
          <div class="w-full h-48 relative">
            <canvas id="weekly-canvas" class="w-full h-full block"></canvas>
          </div>
        </div>

        <!-- 今日時間軸記錄 -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex-1 flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
              <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              今日飲水記錄
            </h2>
            <span id="log-count-text" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">共 0 次</span>
          </div>

          <!-- 紀錄列表 -->
          <div id="logs-container" class="space-y-2.5 overflow-y-auto max-h-64 pr-1"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- 目標設置彈出層 Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl mx-4 transform scale-95 transition-transform" id="modal-box">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-900">調整每日喝水目標</h3>
        <button id="close-settings-btn" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">每日目標 (毫升)</label>
          <input type="number" id="setting-target-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-base font-semibold focus:border-sky-500 outline-none" min="500" max="6000" step="50">
        </div>
        
        <div class="bg-sky-50 p-3.5 rounded-2xl border border-sky-100">
          <p class="text-xs text-sky-800 leading-relaxed">
            💡 <strong>健康建議：</strong> 一般成人每日建議攝取量約為「體重(kg) × 30~35 ml」。例如 60kg 建議每日約 1800~2100 ml。
          </p>
        </div>

        <div class="flex gap-2 pt-2">
          <button id="save-settings-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 rounded-xl transition shadow-md shadow-sky-200">
            確認儲存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 通知提示 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-sm px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none z-50">
    <span class="text-emerald-400 font-bold">✓</span>
    <span id="toast-msg">已記錄喝水！</span>
  </div>

  <script>
    // ==========================================
    // 1. 狀態與資料管理 (純原生 JS)
    // ==========================================
    const APP_KEY_GOAL = 'water_daily_goal';
    const APP_KEY_DATA = 'water_tracking_history';

    let dailyTarget = parseInt(localStorage.getItem(APP_KEY_GOAL), 10) || 2000;
    let records = {};
    try {
      records = JSON.parse(localStorage.getItem(APP_KEY_DATA)) || {};
    } catch (e) {
      records = {};
    }

    // 格式化今日鍵值: "YYYY-MM-DD"
    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    const todayStr = getTodayKey();
    if (!records[todayStr]) {
      records[todayStr] = [];
    }

    // 提醒計時器
    let reminderTimer = null;
    let reminderActive = false;

    // DOM 元素快取
    const currentAmountEl = document.getElementById('current-amount');
    const targetAmountEl = document.getElementById('target-amount');
    const percentageTextEl = document.getElementById('percentage-text');
    const remainingTextEl = document.getElementById('remaining-text');
    const waveFrontEl = document.getElementById('wave-front');
    const waveBackEl = document.getElementById('wave-back');
    const progressBarEl = document.getElementById('progress-bar');
    const cheerTextEl = document.getElementById('cheer-text');
    const logsContainerEl = document.getElementById('logs-container');
    const logCountTextEl = document.getElementById('log-count-text');
    const weeklyCanvas = document.getElementById('weekly-canvas');

    // ==========================================
    // 2. 初始化與事件綁定
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initDateDisplay();
      updateDashboard();
      setupEventListeners();
      
      // 監聽視窗縮放以自適應重繪原生圖表
      window.addEventListener('resize', drawWeeklyChart);
    });

    function initDateDisplay() {
      const dateEl = document.getElementById('current-date-text');
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      dateEl.textContent = now.toLocaleDateString('zh-TW', options);
    }

    // ==========================================
    // 3. 儀表板與視覺狀態更新
    // ==========================================
    function updateDashboard() {
      const todayList = records[todayStr] || [];
      const currentTotal = todayList.reduce((acc, item) => acc + item.amount, 0);

      currentAmountEl.textContent = currentTotal;
      targetAmountEl.textContent = dailyTarget;

      const percentage = Math.min(Math.round((currentTotal / dailyTarget) * 100), 100);
      percentageTextEl.textContent = `${percentage}%`;

      const remaining = dailyTarget - currentTotal;
      if (remaining <= 0) {
        remainingTextEl.textContent = '🎉 已達成今日目標！';
        cheerTextEl.textContent = '太棒了！今日飲水目標已達成，保持代謝順暢！🌟';
      } else {
        remainingTextEl.textContent = `還差 ${remaining} ml`;
        if (percentage >= 75) {
          cheerTextEl.textContent = '就快達標了，再喝一杯就完成了！💪';
        } else if (percentage >= 50) {
          cheerTextEl.textContent = '進度已過半，繼續保持穩定補水！💧';
        } else {
          cheerTextEl.textContent = '喝一口水，為身體注入滿滿活力！🌱';
        }
      }

      progressBarEl.style.width = `${percentage}%`;
      const waveTop = 100 - (percentage * 1.1);
      waveFrontEl.style.top = `${waveTop}%`;
      waveBackEl.style.top = `${waveTop}%`;

      renderLogs(todayList);
      drawWeeklyChart();
      saveToStorage();
    }

    // 渲染紀錄清單 (純原生 DOM 操作)
    function renderLogs(logs) {
      logCountTextEl.textContent = `共 ${logs.length} 次`;

      if (logs.length === 0) {
        logsContainerEl.innerHTML = `
          <div class="text-center py-10 text-slate-400">
            <div class="text-3xl mb-2">🥤</div>
            <p class="text-sm">今天還沒有飲水紀錄，趕快喝一杯吧！</p>
          </div>
        `;
        return;
      }

      const reversedLogs = [...logs].reverse();
      logsContainerEl.innerHTML = reversedLogs.map((item) => `
        <div class="flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-2xl transition border border-slate-100">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-sky-600 font-bold text-sm border border-slate-100">
              ${getTypeEmoji(item.type)}
            </div>
            <div>
              <div class="text-sm font-semibold text-slate-800">${escapeHtml(item.type)}</div>
              <div class="text-xs text-slate-400">${item.time}</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-bold text-sky-600">+${item.amount} ml</span>
            <button onclick="deleteLog('${item.id}')" class="text-slate-300 hover:text-rose-500 transition p-1 text-sm" title="刪除">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function getTypeEmoji(type) {
      switch (type) {
        case '溫開水': return '☕';
        case '無糖茶': return '🍵';
        case '黑咖啡': return '☕';
        case '檸檬水': return '🍋';
        default: return '💧';
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ==========================================
    // 4. 新增與刪除操作
    // ==========================================
    function addRecord(amount, type) {
      if (isNaN(amount) || amount <= 0) {
        showToast('請輸入有效的水量！');
        return;
      }

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      const newEntry = {
        id: Date.now().toString(),
        amount: parseInt(amount, 10),
        type: type || '白開水',
        time: timeStr
      };

      if (!records[todayStr]) records[todayStr] = [];
      records[todayStr].push(newEntry);

      updateDashboard();
      showToast(`已成功記錄 ${amount} ml ${newEntry.type}！`);
    }

    window.quickAddWater = function(amount, type) {
      addRecord(amount, type);
    };

    window.deleteLog = function(id) {
      if (!records[todayStr]) return;
      records[todayStr] = records[todayStr].filter(item => item.id !== id);
      updateDashboard();
      showToast('已刪除該筆記錄');
    };

    // ==========================================
    // 5. 純原生 HTML5 Canvas 柱狀圖繪製
    // ==========================================
    function drawWeeklyChart() {
      if (!weeklyCanvas) return;

      const rect = weeklyCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      // 確保高解析螢幕繪製清晰不失真
      weeklyCanvas.width = rect.width * dpr;
      weeklyCanvas.height = rect.height * dpr;

      const ctx = weeklyCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      // 取得近 7 日資料
      const labels = [];
      const data = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        labels.push(i === 0 ? '今天' : `${d.getMonth() + 1}/${d.getDate()}`);
        const total = (records[key] || []).reduce((acc, item) => acc + item.amount, 0);
        data.push(total);
      }

      const paddingTop = 25;
      const paddingBottom = 30;
      const paddingLeft = 40;
      const paddingRight = 15;

      const chartHeight = height - paddingTop - paddingBottom;
      const chartWidth = width - paddingLeft - paddingRight;

      // 決定 Y 軸最大值
      const maxVal = Math.max(dailyTarget, ...data, 1000);

      // 繪製背景水平參考線與刻度
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 1;

      const gridLines = 3;
      for (let i = 0; i <= gridLines; i++) {
        const yVal = Math.round((maxVal / gridLines) * i);
        const yPos = paddingTop + chartHeight - (yVal / maxVal) * chartHeight;

        ctx.beginPath();
        ctx.moveTo(paddingLeft, yPos);
        ctx.lineTo(width - paddingRight, yPos);
        ctx.stroke();

        ctx.fillText(`${yVal}`, paddingLeft - 8, yPos);
      }

      // 繪製柱狀圖
      const barCount = data.length;
      const barSpacing = chartWidth / barCount;
      const barWidth = Math.min(28, barSpacing * 0.55);

      data.forEach((val, index) => {
        const x = paddingLeft + (index * barSpacing) + (barSpacing - barWidth) / 2;
        const barHeight = Math.max(3, (val / maxVal) * chartHeight);
        const y = paddingTop + chartHeight - barHeight;

        // 當日以深天藍色突顯，其餘日子為淺天藍色
        ctx.fillStyle = index === 6 ? '#0284c7' : '#bae6fd';

        // 圓角柱體
        roundRect(ctx, x, y, barWidth, barHeight, 6);
        ctx.fill();

        // 數值顯示在柱體上方
        if (val > 0) {
          ctx.fillStyle = index === 6 ? '#0284c7' : '#64748b';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${val}`, x + barWidth / 2, y - 8);
        }

        // X 軸日期標籤
        ctx.fillStyle = index === 6 ? '#0f172a' : '#94a3b8';
        ctx.font = index === 6 ? 'bold 11px sans-serif' : '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(labels[index], x + barWidth / 2, height - 10);
      });
    }

    // 輔助繪製圓角矩形
    function roundRect(ctx, x, y, width, height, radius) {
      if (width < 2 * radius) radius = width / 2;
      if (height < 2 * radius) radius = height / 2;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, 0);
      ctx.arcTo(x, y + height, x, y, 0);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function saveToStorage() {
      localStorage.setItem(APP_KEY_DATA, JSON.stringify(records));
      localStorage.setItem(APP_KEY_GOAL, dailyTarget.toString());
    }

    // ==========================================
    // 6. 互動事件綁定
    // ==========================================
    function setupEventListeners() {
      const customAmountInput = document.getElementById('custom-amount-input');
      const customType = document.getElementById('custom-type');
      const addCustomBtn = document.getElementById('add-custom-btn');

      addCustomBtn.addEventListener('click', () => {
        const val = parseInt(customAmountInput.value, 10);
        if (val) {
          addRecord(val, customType.value);
          customAmountInput.value = '';
        } else {
          showToast('請輸入容量');
        }
      });

      const settingsModal = document.getElementById('settings-modal');
      const openSettingsBtn = document.getElementById('open-settings-btn');
      const closeSettingsBtn = document.getElementById('close-settings-btn');
      const saveSettingsBtn = document.getElementById('save-settings-btn');
      const settingTargetInput = document.getElementById('setting-target-input');
      const modalBox = document.getElementById('modal-box');

      openSettingsBtn.addEventListener('click', () => {
        settingTargetInput.value = dailyTarget;
        settingsModal.classList.remove('hidden');
        setTimeout(() => {
          settingsModal.classList.remove('opacity-0');
          modalBox.classList.remove('scale-95');
        }, 10);
      });

      function closeModal() {
        settingsModal.classList.add('opacity-0');
        modalBox.classList.add('scale-95');
        setTimeout(() => {
          settingsModal.classList.add('hidden');
        }, 200);
      }

      closeSettingsBtn.addEventListener('click', closeModal);
      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) closeModal();
      });

      saveSettingsBtn.addEventListener('click', () => {
        const val = parseInt(settingTargetInput.value, 10);
        if (val && val >= 500 && val <= 6000) {
          dailyTarget = val;
          updateDashboard();
          closeModal();
          showToast(`已更新每日目標為 ${dailyTarget} ml`);
        } else {
          showToast('請設定介於 500 到 6000 ml 之間的合理數值');
        }
      });

      // 原生定時器喝水提醒
      const toggleReminderBtn = document.getElementById('toggle-reminder-btn');
      const reminderStatusText = document.getElementById('reminder-status-text');
      const reminderIcon = document.getElementById('reminder-icon');

      toggleReminderBtn.addEventListener('click', () => {
        reminderActive = !reminderActive;
        if (reminderActive) {
          reminderStatusText.textContent = '提醒: 每 60 分鐘';
          reminderIcon.classList.remove('text-slate-400');
          reminderIcon.classList.add('text-sky-600');
          showToast('已開啟定時喝水提醒（每小時提示）');

          reminderTimer = setInterval(() => {
            playWaterDropSound();
            showToast('💧 記得喝口水休息一下，保持水分！');
          }, 60 * 60 * 1000);
        } else {
          reminderStatusText.textContent = '提醒: 關閉';
          reminderIcon.classList.add('text-slate-400');
          reminderIcon.classList.remove('text-sky-600');
          if (reminderTimer) clearInterval(reminderTimer);
          showToast('已關閉定時喝水提醒');
        }
      });
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;

      clearTimeout(toastTimeout);
      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2500);
    }

    // 原生 Web Audio API 合成輕柔水滴提示音效
    function playWaterDropSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {
        // 瀏覽器若受安全策略限制則靜默略過
      }
    }
  </script>
</body>
