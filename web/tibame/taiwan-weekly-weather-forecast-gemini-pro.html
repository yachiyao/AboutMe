<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣觀測</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 隱藏選單的原生樣式並美化 */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }

        /* 載入動畫 */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-white">

    <div class="glass-card w-full max-w-md rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wider mb-2">台灣即時天氣</h1>
            <p class="text-sm text-gray-300">資料來源: Open-Meteo</p>
        </header>

        <!-- 城市選擇器 -->
        <div class="mb-8">
            <select id="citySelect" class="w-full bg-white/20 border border-white/30 text-white rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-300 transition-all cursor-pointer font-medium">
                <!-- 選項會由 JS 動態生成 -->
            </select>
        </div>

        <!-- 載入中畫面 -->
        <div id="loading" class="absolute inset-0 glass-card z-10 flex flex-col items-center justify-center hidden">
            <div class="spinner mb-4"></div>
            <p class="font-medium text-lg">正在獲取天氣資訊...</p>
        </div>

        <!-- 天氣資訊展示區 -->
        <div id="weatherContent" class="text-center transition-opacity duration-300">
            <!-- 天氣圖標與描述 -->
            <div class="mb-4">
                <div id="weatherIcon" class="text-7xl mb-2 drop-shadow-lg filter">☀️</div>
                <h2 id="weatherDesc" class="text-xl font-semibold text-gray-100">晴天</h2>
            </div>

            <!-- 溫度 -->
            <div class="mb-8">
                <span id="temperature" class="text-7xl font-bold tracking-tighter ml-4">--</span>
                <span class="text-3xl font-light align-top">°C</span>
            </div>

            <!-- 附加資訊網格 (濕度、風速) -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/20 rounded-2xl p-4 flex flex-col items-center justify-center">
                    <svg class="w-6 h-6 mb-2 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span class="text-xs text-gray-300 mb-1">相對濕度</span>
                    <span id="humidity" class="text-lg font-bold">--%</span>
                </div>
                
                <div class="bg-black/20 rounded-2xl p-4 flex flex-col items-center justify-center">
                    <svg class="w-6 h-6 mb-2 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    <span class="text-xs text-gray-300 mb-1">風速</span>
                    <span id="windSpeed" class="text-lg font-bold">-- km/h</span>
                </div>
            </div>

            <div class="mt-6 text-xs text-gray-400">
                最後更新時間：<span id="updateTime">--:--</span>
            </div>

            <!-- 一週預報 -->
            <div class="mt-6 border-t border-white/20 pt-4">
                <h3 class="text-sm font-semibold mb-3 text-left">一週天氣預報</h3>
                <div id="forecastList" class="flex flex-col gap-2 text-sm">
                    <!-- 預報項目動態生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 台灣主要城市座標資料
        const taiwanCities = [
            { name: "台北市 (Taipei)", lat: 25.0330, lon: 121.5654 },
            { name: "新北市 (New Taipei)", lat: 25.0170, lon: 121.4628 },
            { name: "桃園市 (Taoyuan)", lat: 24.9936, lon: 121.3010 },
            { name: "新竹市 (Hsinchu)", lat: 24.8138, lon: 120.9675 },
            { name: "台中市 (Taichung)", lat: 24.1477, lon: 120.6736 },
            { name: "嘉義市 (Chiayi)", lat: 23.4800, lon: 120.4491 },
            { name: "台南市 (Tainan)", lat: 23.0000, lon: 120.2000 },
            { name: "高雄市 (Kaohsiung)", lat: 22.6273, lon: 120.3014 },
            { name: "屏東縣 (Pingtung)", lat: 22.6770, lon: 120.4836 },
            { name: "宜蘭縣 (Yilan)", lat: 24.7021, lon: 121.7377 },
            { name: "花蓮縣 (Hualien)", lat: 23.9770, lon: 121.6068 },
            { name: "台東縣 (Taitung)", lat: 22.7583, lon: 121.1444 }
        ];

        // 轉換 WMO 天氣代碼為可讀文字與 Emoji 圖示
        function getWMOInterpretation(code) {
            const wmoCodes = {
                0: { desc: "晴朗無雲", icon: "☀️" },
                1: { desc: "大致晴朗", icon: "🌤️" },
                2: { desc: "多雲", icon: "⛅" },
                3: { desc: "陰天", icon: "☁️" },
                45: { desc: "有霧", icon: "🌫️" },
                48: { desc: "沉積霧", icon: "🌫️" },
                51: { desc: "輕微毛毛雨", icon: "🌧️" },
                53: { desc: "中等毛毛雨", icon: "🌧️" },
                55: { desc: "強烈毛毛雨", icon: "🌧️" },
                56: { desc: "輕微凍雨", icon: "🌧️❄️" },
                57: { desc: "強烈凍雨", icon: "🌧️❄️" },
                61: { desc: "微雨", icon: "☔" },
                63: { desc: "中雨", icon: "☔" },
                65: { desc: "大雨", icon: "☔" },
                66: { desc: "輕微凍雨", icon: "🌧️❄️" },
                67: { desc: "強烈凍雨", icon: "🌧️❄️" },
                71: { desc: "小雪", icon: "❄️" },
                73: { desc: "中雪", icon: "❄️" },
                75: { desc: "大雪", icon: "❄️" },
                77: { desc: "雪粒", icon: "❄️" },
                80: { desc: "短暫陣雨", icon: "🌦️" },
                81: { desc: "中等陣雨", icon: "🌦️" },
                82: { desc: "強烈陣雨", icon: "🌧️" },
                85: { desc: "輕微陣雪", icon: "🌨️" },
                86: { desc: "強烈陣雪", icon: "🌨️" },
                95: { desc: "雷陣雨", icon: "⛈️" },
                96: { desc: "雷陣雨伴隨輕微冰雹", icon: "⛈️❄️" },
                99: { desc: "雷陣雨伴隨強烈冰雹", icon: "⛈️❄️" }
            };
            return wmoCodes[code] || { desc: "未知天氣", icon: "❓" };
        }

        // DOM 元素選取
        const citySelect = document.getElementById('citySelect');
        const loading = document.getElementById('loading');
        const weatherContent = document.getElementById('weatherContent');
        const temperatureEl = document.getElementById('temperature');
        const weatherIconEl = document.getElementById('weatherIcon');
        const weatherDescEl = document.getElementById('weatherDesc');
        const humidityEl = document.getElementById('humidity');
        const windSpeedEl = document.getElementById('windSpeed');
        const updateTimeEl = document.getElementById('updateTime');

        // 初始化下拉選單
        function initSelect() {
            taiwanCities.forEach((city, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = city.name;
                // 為了搭配深色背景，針對 option 修改字體顏色 (在某些瀏覽器下拉選單為白色底)
                option.className = "text-gray-900"; 
                citySelect.appendChild(option);
            });

            // 監聽選擇變更
            citySelect.addEventListener('change', (e) => {
                const selectedCity = taiwanCities[e.target.value];
                fetchWeather(selectedCity.lat, selectedCity.lon);
            });
        }

        // 獲取天氣資料
        async function fetchWeather(lat, lon) {
            // 顯示載入中，淡出內容
            loading.classList.remove('hidden');
            weatherContent.style.opacity = '0';

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTaipei`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                updateUI(data.current);
                renderForecast(data.daily);
            } catch (error) {
                console.error('Error fetching weather data:', error);
                alert("無法獲取天氣資訊，請稍後再試。");
            } finally {
                // 隱藏載入中，淡入內容
                loading.classList.add('hidden');
                weatherContent.style.opacity = '1';
            }
        }

        // 更新介面
        function updateUI(currentData) {
            const { temperature_2m, relative_humidity_2m, weather_code, wind_speed_10m, time } = currentData;
            
            // 取得天氣解析
            const weatherInfo = getWMOInterpretation(weather_code);

            // 更新 DOM
            temperatureEl.textContent = Math.round(temperature_2m);
            weatherIconEl.textContent = weatherInfo.icon;
            weatherDescEl.textContent = weatherInfo.desc;
            humidityEl.textContent = `${relative_humidity_2m}%`;
            windSpeedEl.textContent = `${wind_speed_10m} km/h`;

            // 格式化時間
            const updateDate = new Date(time);
            const timeString = updateDate.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            updateTimeEl.textContent = timeString;
            
            // 可選：根據溫度改變背景顏色
            changeBackgroundByTemp(temperature_2m);
        }

        // 根據溫度調整背景色（漸層效果）
        function changeBackgroundByTemp(temp) {
            let gradient;
            if (temp >= 30) {
                // 炎熱：橘紅色系
                gradient = 'linear-gradient(135deg, #ff4e50 0%, #f9d423 100%)';
            } else if (temp >= 20) {
                // 溫暖/舒適：藍綠色系
                gradient = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
            } else {
                // 寒冷：冷藍灰色系
                gradient = 'linear-gradient(135deg, #4ca1af 0%, #c4e0e5 100%)';
            }
            document.body.style.background = gradient;
        }

        // 渲染一週預報列表
        function renderForecast(daily) {
            const forecastList = document.getElementById('forecastList');
            forecastList.innerHTML = ''; // 清空先前的預報

            // 遍歷 7 天的預報資料
            for (let i = 0; i < daily.time.length; i++) {
                const dateStr = daily.time[i];
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);
                const code = daily.weather_code[i];
                const icon = getWMOInterpretation(code).icon;

                const dateObj = new Date(dateStr);
                const days = ['日', '一', '二', '三', '四', '五', '六'];
                // 判斷是否為今天
                const dayName = i === 0 ? '今日' : `週${days[dateObj.getDay()]}`;
                const shortDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-black/10 rounded-lg py-2 px-3 hover:bg-black/20 transition-colors';
                row.innerHTML = `
                    <span class="w-12 text-left font-medium text-gray-100">${dayName}</span>
                    <span class="text-xs text-gray-300 w-12 text-left">${shortDate}</span>
                    <span class="text-xl w-8 text-center filter drop-shadow-md">${icon}</span>
                    <span class="w-24 text-right text-gray-100">${minTemp}° / ${maxTemp}°C</span>
                `;
                forecastList.appendChild(row);
            }
        }

        // 啟動應用程式
        function initApp() {
            initSelect();
            // 預設載入台北市天氣 (index 0)
            const defaultCity = taiwanCities[0];
            fetchWeather(defaultCity.lat, defaultCity.lon);
        }

        // 當畫面載入完畢後執行
        window.onload = initApp;

    </script>
</body>
</html>
